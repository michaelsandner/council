name: Sitzungen aktualisieren

on:
  schedule:
    # Alle drei Stunden nach neuen Bekanntmachungen und Niederschriften sehen.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      from-year:
        description: 'Erstes Jahr, das gelesen wird'
        required: false
      force:
        description: 'Alle Dokumente neu einlesen'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    name: Termine und Niederschriften einlesen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pdftotext installieren
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Abhängigkeiten holen
        run: flutter pub get

      - name: Scraper ausführen
        run: |
          dart run tool/scrape.dart \
            ${{ inputs.from-year && format('--from-year={0}', inputs.from-year) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Änderungen committen
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add web/data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen Sitzungsunterlagen."
          else
            git commit -m "chore(data): update council minutes and appointments"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not start other workflows, so the
      # deployment of the fresh data has to be requested explicitly.
      - name: Deployment anstoßen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
